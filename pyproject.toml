[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ttwhy-viewer"
version = "0.2.0"
description = "Zoomable microscopy, image and PDF previews in a text terminal"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Jason L Weirather"}]
dependencies = [
    "click>=8.1,<9",
    "coolname>=2.2,<6",
    "numpy>=1.26.4,<3",
    "scipy>=1.14,<2",
    "omeify>=0.22.1",
    "pillow>=11.3,<13",
    "prompt-toolkit>=3.0.52,<4",
    "wcwidth>=0.2.13",
]

[project.optional-dependencies]
# Optional AWS/S3-compatible transport. Local and HTTP(S) Zarr need no extra.
s3 = ["omeify[s3]>=0.22.1"]
pdf = ["pypdfium2>=4.30,<6"]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pexpect>=4.9; sys_platform != 'win32'",
    "ruff>=0.12",
    "build>=1.2",
]

[project.scripts]
ttwhy = "ttwhy.cli:main"

[project.urls]
Repository = "https://github.com/jason-weirather/ttwhy"
Issues = "https://github.com/jason-weirather/ttwhy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ttwhy = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]
