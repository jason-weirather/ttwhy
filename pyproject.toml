[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ttwhy"
version = "0.2.0"
description = "Tiled microscopy in a terminal, with a reusable image-to-text engine"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Jason L Weirather"}]
dependencies = [
    "click>=8.1,<9",
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "omeify>=0.18,<0.19",
    "prompt-toolkit>=3.0.52,<4",
    "wcwidth>=0.2.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pexpect>=4.9; sys_platform != 'win32'",
    "ruff>=0.12",
    "build>=1.2",
]

[project.scripts]
ttwhy = "ttwhy.cli:main"

[project.urls]
Repository = "https://github.com/jason-weirather/ttwhy"
Issues = "https://github.com/jason-weirather/ttwhy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ttwhy = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]
